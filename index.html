<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ต่อคำศัพท์ – Noun Clause</title>
<style>
:root{--bg:#bfe6ff;--card:#fff;--ink:#1b1b1f;--blue:#00a2ff;--green:#02b757;--red:#e2231a;--yellow:#ffc800;--slot:#e8eef5;--bd:#1b1b1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2a44;--card:#2b3552;--ink:#f3f5fa;--slot:#1a2238;--bd:#0b0f1c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:4px solid var(--bd);box-shadow:6px 6px 0 var(--bd);padding:14px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:clamp(26px,7vw,40px);text-align:center;color:var(--blue);text-shadow:3px 3px 0 var(--bd);letter-spacing:1px}
.btn{font:inherit;font-size:18px;color:#fff;background:var(--green);border:4px solid var(--bd);box-shadow:0 5px 0 var(--bd);padding:10px 20px;cursor:pointer;min-height:48px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd)}
.btn.b{background:var(--blue)}.btn.r{background:var(--red)}.btn.y{background:var(--yellow);color:#1b1b1f}
.btn:disabled{opacity:.5}
input{font:inherit;width:100%;padding:10px;border:4px solid var(--bd);background:var(--slot);color:var(--ink);margin:6px 0 10px;font-size:18px}
.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.pill{flex:1;min-width:90px;text-align:center;border:3px solid var(--bd);padding:6px;background:var(--yellow);color:#1b1b1f}
.pill.t{background:var(--blue);color:#fff}.pill.l{background:var(--red);color:#fff}
.bar{height:14px;border:3px solid var(--bd);background:var(--slot);margin:10px 0}
.bar i{display:block;height:100%;background:var(--green);width:100%;transition:width 1s linear}
.slots,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:8px;border:4px dashed var(--bd);background:var(--slot)}
.pool{border-style:solid;margin-top:10px}
.chip{font:inherit;font-size:clamp(16px,4.6vw,22px);padding:8px 12px;border:3px solid var(--bd);box-shadow:0 4px 0 var(--bd);background:var(--yellow);color:#1b1b1f;cursor:pointer}
.slots .chip{background:var(--blue);color:#fff}
.hint{margin:8px 0;font-size:18px}
.msg{min-height:28px;text-align:center;font-size:20px}
.ok{color:var(--green)}.no{color:var(--red)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.hide{display:none}
.avatar{width:60px;margin:6px auto 0;position:relative;height:96px;animation:bob 1s steps(2) infinite}
.avatar div{position:absolute;border:3px solid var(--bd)}
.hd{left:15px;top:0;width:30px;height:30px;background:var(--yellow)}
.bd{left:10px;top:30px;width:40px;height:34px;background:var(--blue)}
.ar{left:-6px;top:30px;width:16px;height:34px;background:var(--yellow)}
.al{left:50px;top:30px;width:16px;height:34px;background:var(--yellow)}
.lg{left:10px;top:64px;width:40px;height:28px;background:var(--green)}
@keyframes bob{50%{transform:translateY(-5px)}}
table{width:100%;border-collapse:collapse}td,th{border:3px solid var(--bd);padding:6px;text-align:center}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.stat div{border:3px solid var(--bd);padding:8px;text-align:center;background:var(--slot)}
.mute{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;padding:6px 12px;min-height:44px}
</style>
</head>
<body>
<div class="wrap">
<!-- หน้าแรก: ระบุตัวผู้เล่น -->
<section id="home" class="card">
 <h1>ต่อคำศัพท์</h1>
 <p style="text-align:center;margin:0">Noun Clause · ม.4</p>
 <div class="avatar"><div class="hd"></div><div class="bd"></div><div class="ar"></div><div class="al"></div><div class="lg"></div></div>
 <label>ชื่อผู้เล่น<input id="pname" maxlength="20" placeholder="เช่น สมชาย"></label>
 <label>ห้อง / เลขที่<input id="pid" maxlength="10" placeholder="เช่น 4/2 เลขที่ 15"></label>
 <p>วิธีเล่น: แตะคำทุกคำที่ให้มาเพื่อเรียงเป็นประโยคที่มี Noun Clause ให้ถูกต้อง ตอบผิดหรือหมดเวลาเสียหัวใจ 1 ดวง มีเวลาข้อละ 1 นาที</p>
 <div class="row"><button class="btn" id="start">▶ เริ่มเกม</button></div>
 <h3>🏆 อันดับสูงสุด</h3><div id="board"></div>
</section>

<!-- หน้าเกม -->
<section id="game" class="hide">
 <div class="card">
  <div class="hud"><div class="pill" id="hName"></div><div class="pill">⭐ <span id="hScore">0</span></div><div class="pill l">❤ <span id="hLife">3</span></div><div class="pill t">⏱ <span id="hTime">60</span></div></div>
  <div class="bar"><i id="tbar"></i></div>
  <div class="hint" id="hint"></div>
  <div class="slots" id="slots"></div>
  <div class="pool" id="pool"></div>
  <div class="msg" id="msg"></div>
  <div class="row"><button class="btn y" id="clear">ล้าง</button><button class="btn b" id="check">ตรวจคำตอบ</button></div>
 </div>
</section>

<!-- หน้าสรุป: Dashboard -->
<section id="result" class="card hide">
 <h1>สรุปผล</h1>
 <p id="rName" style="text-align:center;margin:0"></p>
 <div class="stat" id="stats"></div>
 <div class="row"><button class="btn" id="again">เล่นอีกครั้ง</button><button class="btn b" id="home2">หน้าแรก</button></div>
 <h3>🏆 อันดับสูงสุด</h3><div id="board2"></div>
</section>
</div>
<button class="btn y mute" id="mute">🔊</button>

<script>
/* ===== ข้อมูลโจทย์: แก้ไขได้ที่นี่ =====
   a = ประโยคเรียงถูกต้อง (แยกเป็นคำ), h = คำใบ้ภาษาไทย */
const QUESTIONS=[
 {a:["I","know","that","she","is","a","doctor"],h:"ฉันรู้ว่าเธอเป็นหมอ"},
 {a:["Tell","me","what","you","want"],h:"บอกฉันว่าคุณต้องการอะไร"},
 {a:["I","don't","know","where","he","lives"],h:"ฉันไม่รู้ว่าเขาอยู่ที่ไหน"},
 {a:["She","asked","if","you","were","ready"],h:"เธอถามว่าคุณพร้อมไหม"},
 {a:["What","he","said","surprised","everyone"],h:"สิ่งที่เขาพูดทำให้ทุกคนแปลกใจ"},
 {a:["The","question","is","whether","we","can","win"],h:"คำถามคือเราชนะได้หรือไม่"},
 {a:["I","wonder","why","the","sky","is","blue"],h:"ฉันสงสัยว่าทำไมท้องฟ้าเป็นสีฟ้า"},
 {a:["He","told","me","that","he","was","tired"],h:"เขาบอกฉันว่าเขาเหนื่อย"},
 {a:["Do","you","know","how","she","did","it"],h:"คุณรู้ไหมว่าเธอทำมันได้อย่างไร"},
 {a:["We","believe","that","honesty","is","important"],h:"เราเชื่อว่าความซื่อสัตย์สำคัญ"}
];
const Q_TIME=60, LIVES=3, PTS=10; // เวลาต่อข้อ (วินาที), จำนวนหัวใจ, คะแนนต่อข้อ

const $=id=>document.getElementById(id);
let S; // สถานะเกม
const show=id=>["home","game","result"].forEach(n=>$(n).classList.toggle("hide",n!==id));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== เก็บสถิติผู้เล่น (localStorage ใส่ try/catch) ===== */
function loadRuns(){try{return JSON.parse(localStorage.getItem("ncq_runs")||"[]")}catch(e){return[]}}
function saveRun(r){try{const a=loadRuns();a.push(r);localStorage.setItem("ncq_runs",JSON.stringify(a.slice(-200)))}catch(e){}}
function renderBoard(el){
 const top=loadRuns().sort((a,b)=>b.score-a.score).slice(0,5);
 el.innerHTML=top.length?"<table><tr><th>#</th><th>ชื่อ</th><th>ห้อง</th><th>คะแนน</th></tr>"+
  top.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.id)}</td><td>${r.score}</td></tr>`).join("")+"</table>":"ยังไม่มีข้อมูล";
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== เสียงดนตรีประกอบ (WebAudio ไม่ใช้ไฟล์ภายนอก) ===== */
let ac,muted=false,musicT;
const NOTES=[262,330,392,330,294,349,440,349,262,330,392,523,494,392,330,294];
function tone(f,d,type="square",v=.05){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}
function startMusic(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){return}
 if(musicT)return;let i=0;musicT=setInterval(()=>{tone(NOTES[i++%NOTES.length],.25,"triangle",.04)},280)}
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊"};

/* ===== ตรรกะเกม ===== */
function start(){
 const name=$("pname").value.trim(),id=$("pid").value.trim();
 if(!name){$("pname").focus();return}
 startMusic();
 S={name,id:id||"-",score:0,life:LIVES,time:Q_TIME,lock:0,ok:0,bad:0,qs:shuffle(QUESTIONS),qi:0,placed:[],chips:[]};
 $("hName").textContent=name;show("game");loadQ();
 S.timer=setInterval(tick,1000);
}
function tick(){if(S.lock)return;S.time--;if(S.time<=0){timeout();return}paintHud()}
/* หมดเวลาข้อนี้: เสียหัวใจ 1 ดวงแล้วไปข้อถัดไป */
function timeout(){S.bad++;S.life--;tone(150,.3,"sawtooth");paintHud();if(S.life<=0)return end("หัวใจหมด!");S.qi++;if(S.qi>=S.qs.length)return end("ครบทุกข้อ!");loadQ();$("msg").innerHTML='<span class="no">⏱ หมดเวลาข้อก่อนหน้า</span>'}
function paintHud(){$("hScore").textContent=S.score;$("hLife").textContent=S.life;$("hTime").textContent=S.time;$("tbar").style.width=(S.time/Q_TIME*100)+"%"}
function loadQ(){
 const q=S.qs[S.qi];S.placed=[];S.time=Q_TIME;S.lock=0;
 S.chips=shuffle(q.a.map((w,i)=>({w,i})));
 $("hint").textContent="💡 "+q.h+"  ("+(S.qi+1)+"/"+S.qs.length+")";
 $("msg").textContent="";paintHud();draw();
}
function draw(){
 const used=new Set(S.placed.map(c=>c.i));
 $("slots").innerHTML="";$("pool").innerHTML="";
 S.placed.forEach(c=>mk($("slots"),c,()=>{S.placed=S.placed.filter(p=>p!==c);draw();tone(300,.08)}));
 S.chips.filter(c=>!used.has(c.i)).forEach(c=>mk($("pool"),c,()=>{S.placed.push(c);draw();tone(520,.08)}));
}
function mk(parent,c,fn){const b=document.createElement("button");b.className="chip";b.textContent=c.w;b.onclick=fn;parent.appendChild(b)}
function checkAns(){
 if(!S||S.lock||!S.placed.length)return;
 const q=S.qs[S.qi],got=S.placed.map(c=>c.w).join(" ");
 if(got===q.a.join(" ")){
  S.ok++;S.lock=1;S.score+=PTS+Math.min(10,S.time/6|0);tone(660,.15);setTimeout(()=>tone(880,.2),120);
  $("msg").innerHTML='<span class="ok">✔ ถูกต้อง!</span>';
  S.qi++;setTimeout(()=>{S.qi>=S.qs.length?end("ครบทุกข้อ!"):loadQ()},600);
 }else{
  S.bad++;S.life--;tone(150,.3,"sawtooth");
  $("msg").innerHTML='<span class="no">✘ ยังไม่ถูก ลองใหม่</span>';
  S.placed=[];draw();paintHud();if(S.life<=0)end("หัวใจหมด!");
 }
}
function end(reason){
 clearInterval(S.timer);
 
 const tot=S.ok+S.bad,acc=tot?Math.round(S.ok/tot*100):0;
 saveRun({name:S.name,id:S.id,score:S.score,ok:S.ok,bad:S.bad,t:Date.now()});
 $("rName").textContent=S.name+" ("+S.id+") – "+reason;
 $("stats").innerHTML=[["⭐ คะแนน",S.score],["✔ ตอบถูก",S.ok],["✘ ตอบผิด",S.bad],["🎯 ความแม่นยำ",acc+"%"],["📋 ข้อที่ทำ",Math.min(S.qi,S.qs.length)+"/"+S.qs.length],["❤ หัวใจที่เหลือ",Math.max(0,S.life)]]
  .map(a=>`<div>${a[0]}<br><big>${a[1]}</big></div>`).join("");
 renderBoard($("board2"));show("result");
}
$("start").onclick=start;
$("check").onclick=checkAns;
$("clear").onclick=()=>{if(S){S.placed=[];draw()}};
$("again").onclick=()=>{S.name&&start()};
$("home2").onclick=()=>{renderBoard($("board"));show("home")};
renderBoard($("board"));
</script>
</body>
</html>
